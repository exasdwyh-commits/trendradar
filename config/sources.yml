    note: "站点结构不稳定，后续做专用 adapter。"

  - id: mofcom
    name: 商务部
    lane: GLOBALIZATION
    role: PRIMARY
    type: html
    url: https://www.mofcom.gov.cn/
    enabled: false
    note: "后续做专用 adapter。"

  - id: miit
    name: 工业和信息化部
    lane: INDUSTRY
    role: PRIMARY
    type: html
    url: https://www.miit.gov.cn/
