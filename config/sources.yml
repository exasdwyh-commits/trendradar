version: 5

# Opportunity Radar source registry.
#
# kind:    demand (people describing problems) | supply (products that exist) | hybrid | story (editorial feeds for the brief)
# mode:    live | mock  — mock sources serve bundled fixtures and are always labelled as such in the UI.
# adapter: hackernews | reddit | github_issues | github_repos | producthunt | rss | html | mock
#
# Live sources that need no API key: hackernews. Product Hunt needs PRODUCTHUNT_TOKEN (else it falls
# back to mock automatically). GitHub works without a token at low rate limits. Reddit is opt-in.

sources:
  # ───────── demand: live ─────────
  - id: hn
    name: Hacker News
    adapter: hackernews
    kind: demand
    mode: live
    enabled: true
    reliability: 80
    max_per_round: 60
    window_days: 30
    queries:
      - "is there a tool that"
      - "I hate that I have to"
      - "alternative to"
      - "every time I have to manually"
      - "I wrote a script to"
      - "why is there no"
      - "too expensive for a solo"
      - "wish there was an app"

  - id: github-issues
    name: GitHub Issues
    adapter: github_issues
    kind: demand
    mode: live
    enabled: true
    reliability: 75
    max_per_round: 40
    window_days: 60
    queries:
      - "feature request workaround manually"
      - "would pay for"
      - "is:open label:enhancement \"would be great if\""

  - id: reddit
    name: Reddit
    adapter: reddit
    kind: demand
    mode: live
    enabled: true          # effective only when REDDIT_ENABLED=true and REDDIT_USER_AGENT is set
    reliability: 70
    max_per_round: 80
    window_days: 30
    subreddits: [SaaS, Entrepreneur, webdev, productivity, macapps, freelance, smallbusiness, ClaudeAI, cursor]
    queries:
      - "is there a tool"
      - "I hate"
      - "alternative to"
      - "manually every"

  # ───────── supply: live (or auto-mock without token) ─────────
  - id: producthunt
    name: Product Hunt
    adapter: producthunt
    kind: supply
    mode: live
    enabled: true
    reliability: 85
    max_per_round: 60
    window_days: 90
    topics: [developer-tools, productivity, artificial-intelligence, saas, mac, chrome-extensions, no-code]

  - id: github-repos
    name: GitHub Repositories
    adapter: github_repos
    kind: supply
    mode: live
    enabled: true
    reliability: 75
    max_per_round: 30
    window_days: 365
    queries: []            # used on demand by Explore / competition search

  # ───────── demand: mock fixtures (3 demo scenarios) ─────────
  - id: mock-reddit
    name: Reddit (demo fixtures)
    adapter: mock
    kind: demand
    mode: mock
    enabled: true
    reliability: 50
    note: "Hand-written demo threads. Never presented as live data."
  - id: mock-hn
    name: Hacker News (demo fixtures)
    adapter: mock
    kind: demand
    mode: mock
    enabled: true
    reliability: 50
  - id: mock-github
    name: GitHub Issues (demo fixtures)
    adapter: mock
    kind: demand
    mode: mock
    enabled: true
    reliability: 50

