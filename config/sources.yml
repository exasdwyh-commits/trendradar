version: 3

# 彻底商业化：不再抓娱乐/泛社会/体育/热搜。
# role:
#   PRIMARY   原始事实/公司/统计/行业组织
#   VERIFIER  独立媒体/研究验证
#   DISCOVERY 只发现线索
#
# lane:
#   COMPANY | INDUSTRY | BUSINESS_MODEL | AI_COMMERCIALIZATION | GLOBALIZATION

sources:
  # ===== AI 商业化：第一方 =====
  - id: openai-news
    name: OpenAI News
    lane: AI_COMMERCIALIZATION
    role: PRIMARY
    type: html
    url: https://openai.com/news/
    include: "/index/|/news/|/business/"

  - id: anthropic-news
    name: Anthropic News
    lane: AI_COMMERCIALIZATION
    role: PRIMARY
    type: html
    url: https://www.anthropic.com/news
    include: "/news/"

  - id: google-deepmind
    name: Google DeepMind
    lane: AI_COMMERCIALIZATION
    role: PRIMARY
    type: html
    url: https://deepmind.google/discover/blog/
    include: "/discover/blog/"

  - id: nvidia-blog
    name: NVIDIA Blog
    lane: INDUSTRY
    role: PRIMARY
    type: html
    url: https://blogs.nvidia.com/
    include: "/blog/|/data-center/|/industries/"

  - id: microsoft-ai
    name: Microsoft AI
    lane: AI_COMMERCIALIZATION
    role: PRIMARY
    type: html
    url: https://blogs.microsoft.com/ai/
    include: "/ai/"

  - id: meta-ai
    name: Meta AI
    lane: AI_COMMERCIALIZATION
    role: PRIMARY
    type: html
    url: https://ai.meta.com/blog/
    include: "/blog/"

  # ===== 公司 / 资本 / 商业 =====
  - id: sec-edgar
    name: SEC EDGAR
    lane: COMPANY
    role: PRIMARY
    type: html
    url: https://www.sec.gov/edgar/search/
    enabled: false
    note: "需要专用 filing adapter；先登记，不用通用 HTML 抓取。"

  - id: yc-companies
    name: Y Combinator Companies
    lane: BUSINESS_MODEL
    role: PRIMARY
    type: html
    url: https://www.ycombinator.com/companies
    include: "/companies/"

  - id: techcrunch
    name: TechCrunch
    lane: BUSINESS_MODEL
    role: VERIFIER
    type: rss
    url: https://techcrunch.com/feed/

  - id: reuters-business
    name: Reuters Business
    lane: COMPANY
    role: VERIFIER
    type: html
    url: https://www.reuters.com/business/
    include: "/business/"

  - id: reuters-technology
    name: Reuters Technology
    lane: AI_COMMERCIALIZATION
    role: VERIFIER
    type: html
    url: https://www.reuters.com/technology/
    include: "/technology/"

  - id: financial-times
    name: Financial Times
    lane: COMPANY
    role: VERIFIER
    type: html
    url: https://www.ft.com/companies
    include: "/content/"

  # ===== 产业 / 能源 / 制造 =====
  - id: iea
    name: International Energy Agency
    lane: INDUSTRY
    role: PRIMARY
    type: html
    url: https://www.iea.org/news
    include: "/news/"

  - id: semiconductor-industry-association
    name: Semiconductor Industry Association
    lane: INDUSTRY
    role: PRIMARY
    type: html
    url: https://www.semiconductors.org/category/press-releases/
    include: "/press-releases/"

  - id: ifr
    name: International Federation of Robotics
    lane: INDUSTRY
    role: PRIMARY
    type: html
    url: https://ifr.org/ifr-press-releases
    include: "/ifr-press-releases/"

  - id: construction-physics
    name: Construction Physics
    lane: INDUSTRY
    role: VERIFIER
    type: html
    url: https://www.construction-physics.com/
    include: "/p/"

  # ===== 中国商业映射 =====
  - id: china-nbs
    name: 国家统计局
    lane: INDUSTRY
    role: PRIMARY
    type: html
    url: https://www.stats.gov.cn/sj/zxfb/
