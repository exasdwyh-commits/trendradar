version: 4

# TrendRadar 3.1 商业信号源注册表
#
# role:
#   PRIMARY   第一方/官方/原始数据
#   VERIFIER  高质量独立媒体/研究
#   DISCOVERY 社区/作者/论坛，仅负责发现线索
#
# tier:
#   1 核心源：每日稳定抓，商业信号密度高
#   2 重要源：每日抓但限额更低
#   3 行业源：补充行业结构变化
#   4 Discovery：只发现线索，不独立形成高置信结论
#
# quality:
#   reliability / business_value / noise / accuracy 取值 0-100
#   max_per_round 控制单轮抓取上限，防止低产出源淹没候选池

