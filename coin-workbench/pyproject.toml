[project]
name = "coin-workbench"
version = "0.1.0"
description = "Cognition-first global intelligence and WeChat writing workbench"
requires-python = ">=3.11"
dependencies = [
  "feedparser>=6.0.11",
  "httpx>=0.27.0",
  "PyYAML>=6.0.2",
]

[project.scripts]
coin-workbench = "coinworkbench.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
