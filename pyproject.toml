[project]
name = "trendradar"
version = "3.0.0"
description = "Business intelligence and WeChat content workbench"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12.3",
  "fastapi>=0.115.0",
  "feedparser>=6.0.11",
  "httpx>=0.27.2",
  "PyYAML>=6.0.2",
  "uvicorn>=0.30.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[project.scripts]
trendradar = "trendradar.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
