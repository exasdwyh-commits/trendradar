<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>硬币先生 · 商业趋势工作台</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f6f7f9;color:#172033}
*{box-sizing:border-box} body{margin:0}.shell{display:grid;grid-template-columns:208px 1fr;min-height:100vh}
aside{background:#fff;border-right:1px solid #e8ebf0;padding:28px 18px}.brand{font-weight:760;font-size:18px;margin-bottom:28px}
nav a{display:block;padding:10px 12px;margin:4px 0;color:#5d6678;text-decoration:none;border-radius:10px}
nav a.active{background:#eef3ff;color:#2257d6;font-weight:650}.pro{margin-top:30px;color:#9aa2af;font-size:12px}
main{padding:44px 5vw;max-width:1260px}.eyebrow{color:#7a8497;font-size:13px}.top{display:flex;align-items:end;justify-content:space-between}
h1{font-size:32px;margin:8px 0}.sub{color:#6d7586;margin:0 0 30px}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}
.stack{display:grid;gap:16px}.card{background:#fff;border:1px solid #e6e9ee;border-radius:14px;padding:22px}
.card h2{font-size:21px;line-height:1.35;margin:8px 0 12px}.meta{font-size:12px;color:#8a93a3}.label{font-size:12px;color:#2c5edb;font-weight:700}
.fact{color:#50596a;line-height:1.65}.change{margin-top:14px;padding-top:14px;border-top:1px solid #edf0f4;line-height:1.65}
button{border:0;border-radius:10px;padding:10px 14px;background:#235bdd;color:#fff;font-weight:650;margin-top:16px}
.section{margin-top:34px}.empty{padding:22px;background:#fff;border:1px solid #e6e9ee;border-radius:14px;color:#7e8797}
@media(max-width:760px){.shell{display:block}aside{display:none}main{padding:24px 16px}.grid{grid-template-columns:1fr}.top{display:block}h1{font-size:27px}}
</style>
</head>
<body>
<div class="shell">
<aside>
  <div class="brand">硬币先生</div>
  <nav>
    <a class="active">今日重点</a>
    <a>待我决定</a>
    <a>研究中</a>
    <a>创作中</a>
    <a>趋势库</a>
    <a>判断账本</a>
  </nav>
  <div class="pro">专业工具<br>情报池 · 来源 · AI运行</div>
</aside>
<main>
  <div class="top">
    <div><div class="eyebrow">BUSINESS COGNITION</div><h1>今天最值得理解的商业变化</h1></div>
    <div class="meta" id="fresh">尚未运行</div>
  </div>
  <p class="sub">后台可以有很多信息；这里默认只给你 3 件事。</p>
  <div class="grid">
    <div id="hero"></div>
    <div class="stack" id="side"></div>
  </div>
  <div class="section"><h3>今天还有什么需要我决定？</h3><div class="empty">暂无。只有需要你拍板的事情才会出现在这里。</div></div>
</main>
</div>
<script>
const card=(x,i)=>`<div class="card"><div class="label">${i===0?'今日首选':i===1?'值得关注':'继续观察'}</div><h2>${x.title}</h2><div class="fact">${x.event_summary||'已进入商业候选池，等待认知模型补充事件摘要。'}</div><div class="change"><b>为什么值得看</b><br>商业价值 ${Math.round(x.content_score)} · 认知价值 ${Math.round(x.cognition_score)}</div><button>进入研究</button></div>`;
async function boot(){
  const h=await fetch('/api/health').then(r=>r.json());
  if(h.last_run) document.querySelector('#fresh').textContent='最近一轮：'+h.last_run.status;
  const d=await fetch('/api/today?limit=3').then(r=>r.json());
  if(!d.items.length){document.querySelector('#hero').innerHTML='<div class="empty">还没有结果。先运行 trendradar daily。</div>';return}
  document.querySelector('#hero').innerHTML=card(d.items[0],0);
  document.querySelector('#side').innerHTML=d.items.slice(1).map((x,i)=>card(x,i+1)).join('');
}
boot();
</script>
</body>
</html>
