<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>硬币先生 · 商业趋势工作台</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;background:#f7f8fa;color:#172033}
*{box-sizing:border-box}body{margin:0}.shell{display:grid;grid-template-columns:208px 1fr;min-height:100vh}
aside{background:#fff;border-right:1px solid #e8ebf0;padding:28px 18px;position:sticky;top:0;height:100vh}.brand{font-weight:780;font-size:18px;margin-bottom:30px}
nav button{width:100%;text-align:left;border:0;background:none;padding:10px 12px;margin:3px 0;color:#60697a;border-radius:10px;font-size:14px;cursor:pointer}
nav button.active{background:#eef3ff;color:#2257d6;font-weight:700}.pro{margin:28px 12px 8px;color:#a0a7b4;font-size:11px;letter-spacing:.08em}
main{padding:42px 5vw;max-width:1260px}.top{display:flex;align-items:end;justify-content:space-between;gap:20px}.eyebrow{color:#8c95a5;font-size:12px;letter-spacing:.1em}
h1{font-size:30px;margin:7px 0}.sub{color:#6f7889;margin:0 0 28px;line-height:1.7}.meta{font-size:12px;color:#8d96a6}
.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}.stack{display:grid;gap:16px}.card,.panel{background:#fff;border:1px solid #e6e9ee;border-radius:14px;padding:22px}
.card h2,.panel h2{font-size:20px;line-height:1.45;margin:7px 0 11px}.label{font-size:12px;color:#2d5fd7;font-weight:700}.muted{color:#6f7889}.body{line-height:1.75;color:#4f5869}
.kv{display:grid;grid-template-columns:120px 1fr;gap:8px 16px;padding:10px 0;border-top:1px solid #eef0f3}.kv:first-child{border-top:0}.key{color:#929aa8;font-size:13px}.value{line-height:1.65}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.primary,.secondary,.danger{border:0;border-radius:9px;padding:9px 13px;font-weight:650;cursor:pointer}
.primary{background:#235bdd;color:white}.secondary{background:#eef1f5;color:#4c5566}.danger{background:#fff0ee;color:#b6483e}
.section{margin-top:30px}.list{display:grid;gap:10px}.row{background:#fff;border:1px solid #e8ebef;border-radius:12px;padding:16px 18px;display:grid;gap:7px}
.row-title{font-weight:700;line-height:1.45}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{font-size:11px;padding:4px 7px;background:#f1f3f6;border-radius:999px;color:#737c8c}
.good{color:#1c7c54}.warn{color:#a06b00}.bad{color:#b7473e}.empty{padding:24px;background:#fff;border:1px solid #e6e9ee;border-radius:14px;color:#7e8797}
pre{white-space:pre-wrap;font-family:inherit;line-height:1.75}.hidden{display:none!important}.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.shell{display:block}aside{position:static;height:auto;border-right:0;border-bottom:1px solid #e8ebf0;padding:14px 16px}.brand{margin:0 0 8px}nav{display:flex;overflow:auto;gap:5px}nav button{white-space:nowrap;width:auto}.pro{display:none}main{padding:24px 16px}.grid,.split{grid-template-columns:1fr}.top{display:block}h1{font-size:26px}}
</style>
</head>
<body>
<div class="shell">
<aside>
  <div class="brand">硬币先生</div>
  <nav id="nav">
    <button data-view="today" class="active">今日重点</button>
    <button data-view="decisions">待我决定</button>
    <button data-view="research">研究中</button>
    <button data-view="writing">创作中</button>
    <button data-view="trends">趋势库</button>
    <button data-view="ledger">判断账本</button>
  </nav>
  <div class="pro">专业工具</div>
  <nav>
    <button data-view="intelligence">情报池</button>
    <button data-view="sources">来源状态</button>
    <button data-view="system">系统状态</button>
  </nav>
</aside>
<main id="app"><div class="empty">正在读取工作台…</div></main>
</div>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const get=async u=>{const r=await fetch(u);if(!r.ok)throw new Error(await r.text());return r.json()};
const post=async(u,b)=>{const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):null});if(!r.ok)throw new Error(await r.text());return r.json()};
const label=a=>a==='WRITE'?'今天值得写':a==='TRACK'?'继续跟踪':a==='HOLD'?'暂不下结论':'略过';
const tag=s=>'<span class="chip">'+esc(s)+'</span>';
const empty=t=>'<div class="empty">'+esc(t)+'</div>';
let state={view:'today',dashboard:null};

function shell(title,sub,body,meta=''){
  return '<div class="top"><div><div class="eyebrow">BUSINESS COGNITION</div><h1>'+esc(title)+'</h1></div><div class="meta">'+esc(meta)+'</div></div><p class="sub">'+esc(sub)+'</p>'+body;
}
function focusCard(x,i){
  const why=x.what_changed||'已进入商业候选池，等待认知分析。';
  return '<div class="card"><div class="label">'+(i===0?'今日首选':i===1?'值得关注':'继续观察')+'</div><h2>'+esc(x.title)+'</h2><div class="body">'+esc(x.event_summary||'')+'</div><div class="kv"><div class="key">真正变化</div><div class="value">'+esc(why)+'</div></div><div class="kv"><div class="key">建议</div><div class="value">'+esc(label(x.action))+'</div></div><div class="actions"><button class="primary" onclick="openCandidate(\''+x.id+'\')">进入研究</button></div></div>';
}
async function viewToday(){
  const d=await get('/api/dashboard');state.dashboard=d;
  const a=d.today||[];
  let cards=a.length?'<div class="grid"><div>'+focusCard(a[0],0)+'</div><div class="stack">'+a.slice(1).map((x,i)=>focusCard(x,i+1)).join('')+'</div></div>':empty('还没有结果。先运行 trendradar daily。');
  const decisions=(d.pending_decisions||[]).length?'<div class="section"><h3>今天还需要我决定</h3><div class="list">'+d.pending_decisions.slice(0,3).map(x=>'<div class="row"><div class="row-title">'+esc(x.thesis)+'</div><div class="muted">'+esc(x.candidate_title)+'</div><div class="actions"><button class="primary" onclick="setView(\'decisions\')">去判断</button></div></div>').join('')+'</div></div>':'<div class="section"><h3>今天还需要我决定</h3>'+empty('没有。系统只在需要你拍板时打扰你。')+'</div>';
  app.innerHTML=shell('今天最值得理解的商业变化','后台可以抓很多，这里默认只给你 3 件事。',cards+decisions);
}
async function viewDecisions(){
  const d=await get('/api/theses?status=PENDING');
  const body=d.items.length?'<div class="list">'+d.items.map(x=>'<div class="panel"><div class="label">核心观点待确认</div><h2>'+esc(x.thesis)+'</h2><div class="kv"><div class="key">来源选题</div><div class="value">'+esc(x.candidate_title)+'</div></div><div class="kv"><div class="key">支持</div><div class="value">'+esc((x.support_json||[]).join('；'))+'</div></div><div class="kv"><div class="key">最强反方</div><div class="value">'+esc((x.counter_json||[]).join('；'))+'</div></div><div class="kv"><div class="key">若判断错误</div><div class="value">'+esc(x.falsification_signal||'待补充')+'</div></div><div class="actions"><button class="primary" onclick="confirmThesis(\''+x.id+'\')">认同并进入创作</button><button class="secondary" onclick="holdThesis(\''+x.id+'\')">暂不下结论</button></div></div>').join('')+'</div>':empty('目前没有需要你确认的观点。');
  app.innerHTML=shell('待我决定','这里只放真正需要人判断的不可逆节点。',body);
}
async function viewResearch(){
  const d=await get('/api/candidates?limit=25');
  const items=d.items.filter(x=>x.action!=='SKIP');
  const body=items.length?'<div class="list">'+items.map(x=>'<div class="row"><div class="chips">'+tag(x.action)+tag(x.cognition_status)+'</div><div class="row-title">'+esc(x.title)+'</div><div class="muted">'+esc(x.what_changed||x.event_summary||'')+'</div><div class="actions"><button class="secondary" onclick="openCandidate(\''+x.id+'\')">查看证据</button></div></div>').join('')+'</div>':empty('暂无研究候选。');
  app.innerHTML=shell('研究中','先看事实，再决定是否形成观点。',body);
}
async function openCandidate(id){
  const d=await get('/api/candidates/'+id),x=d.candidate,e=d.evidence||[];
  const ev=e.map(s=>'<div class="row"><div class="chips">'+tag(s.source_role)+tag(s.kind)+'</div><div class="row-title">'+esc(s.title)+'</div><div class="muted">'+esc(s.source_id)+' · '+esc(s.published_at||'时间未知')+'</div><div class="body">'+esc(s.summary||'')+'</div></div>').join('');
  const body='<div class="panel"><div class="label">'+esc(label(x.action))+'</div><h2>'+esc(x.title)+'</h2><div class="kv"><div class="key">发生了什么</div><div class="value">'+esc(x.event_summary||'')+'</div></div><div class="kv"><div class="key">真正变化</div><div class="value">'+esc(x.what_changed||'待认知模型分析')+'</div></div><div class="kv"><div class="key">为什么现在</div><div class="value">'+esc(x.why_now||'待分析')+'</div></div><div class="kv"><div class="key">利润池</div><div class="value">'+esc(x.profit_pool||'待分析')+'</div></div><div class="kv"><div class="key">谁受益 / 受损</div><div class="value">'+esc((x.who_benefits||'')+' / '+(x.who_loses||''))+'</div></div><div class="kv"><div class="key">中国映射</div><div class="value">'+esc(x.china_mapping||'待验证')+'</div></div><div class="kv"><div class="key">最强反方</div><div class="value">'+esc(x.strongest_counter||'待补充')+'</div></div><div class="actions"><button class="primary" onclick="research(\''+id+'\')">生成研究包</button><button class="secondary" onclick="makeThesis(\''+id+'\')">提出核心观点</button></div></div><div class="section"><h3>证据</h3><div class="list">'+ev+'</div></div>';
  app.innerHTML=shell('研究详情','先结论后证据，但所有结论都能回到原始来源。',body);
}
async function research(id){try{await post('/api/candidates/'+id+'/research');alert('研究包已生成');openCandidate(id)}catch(e){alert(e.message)}}
async function makeThesis(id){try{await post('/api/candidates/'+id+'/thesis');setView('decisions')}catch(e){alert(e.message)}}
async function confirmThesis(id){try{await post('/api/theses/'+id+'/confirm',{horizon:'12个月'});await post('/api/theses/'+id+'/draft');setView('writing')}catch(e){alert(e.message)}}
async function holdThesis(id){try{await post('/api/theses/'+id+'/hold');viewDecisions()}catch(e){alert(e.message)}}
async function viewWriting(){
  const d=await get('/api/articles');
  const body=d.items.length?'<div class="list">'+d.items.map(x=>'<div class="panel"><div class="chips">'+tag(x.status)+'</div><h2>'+esc(x.title||x.candidate_title)+'</h2><div class="muted">'+esc(x.thesis)+'</div><div class="actions"><button class="secondary" onclick="openArticle(\''+x.id+'\')">打开</button></div></div>').join('')+'</div>':empty('暂无文章。确认一个观点后才会进入创作。');
  app.innerHTML=shell('创作中','Research → Thesis → Draft → Challenger，一个阶段只做一件事。',body);
}
async function openArticle(id){
  const x=await get('/api/articles/'+id);const r=x.latest_review;
  let review=r?'<div class="section panel"><div class="label">Challenger</div><div class="kv"><div class="key">结论</div><div class="value">'+esc(r.verdict)+'</div></div><div class="kv"><div class="key">最强反方</div><div class="value">'+esc(r.strongest_counter||'')+'</div></div><div class="kv"><div class="key">标题风险</div><div class="value">'+esc(r.headline_risk||'')+'</div></div></div>':'';
  const body='<div class="panel"><div class="chips">'+tag(x.status)+'</div><h2>'+esc(x.title)+'</h2><div class="muted">核心观点：'+esc(x.thesis)+'</div><pre>'+esc(x.body||'')+'</pre><div class="actions"><button class="primary" onclick="challenge(\''+id+'\')">运行 Challenger</button><button class="secondary" onclick="exportArticle(\''+id+'\',\'wechat\')">导出微信HTML</button><button class="secondary" onclick="exportArticle(\''+id+'\',\'md\')">导出Markdown</button></div></div>'+review;
  app.innerHTML=shell('文章','成稿不是终点，先让独立挑战者找漏洞。',body);
}
async function challenge(id){try{await post('/api/articles/'+id+'/challenge');openArticle(id)}catch(e){alert(e.message)}}
async function exportArticle(id,f){try{const d=await post('/api/articles/'+id+'/export/'+f);window.open(d.url,'_blank')}catch(e){alert(e.message)}}
async function viewTrends(){
  const d=await get('/api/trends');const w=d.world_model;
  let wm=w?'<div class="panel"><div class="label">最近的世界模型变化</div><div class="body">'+esc(w.summary||'')+'</div><div class="chips">'+tag('强化 '+(w.strengthened||[]).length)+tag('减弱 '+(w.weakened||[]).length)+tag('分歧 '+(w.diverging||[]).length)+tag('新出现 '+(w.new||[]).length)+'</div></div>':'';
  const rows=d.items.length?'<div class="section list">'+d.items.map(x=>'<div class="row"><div class="chips">'+tag(x.status)+tag(x.stage)+tag(x.momentum)+'</div><div class="row-title">'+esc(x.name)+'</div><div class="body">'+esc(x.judgement)+'</div><div class="muted">支持 '+x.support_count+' · 反证 '+x.counter_count+' · 待定 '+x.uncertain_count+'</div><div class="actions"><button class="secondary" onclick="openTrend(\''+x.id+'\')">查看变化</button></div></div>').join('')+'</div>':empty('趋势库还没有足够独立证据。');
  app.innerHTML=shell('趋势库','第一屏先看“什么变了”，而不是静态标签目录。',wm+rows);
}
async function openTrend(id){
  const d=await get('/api/trends/'+id),x=d.trend;
  const evidence=d.evidence.map(e=>'<div class="row"><div class="chips">'+tag(e.stance)+(e.subject_key?tag(e.subject_key):'')+'</div><div class="body">'+esc(e.summary)+'</div></div>').join('');
  const rev=d.revisions.map(r=>'<div class="row"><div class="muted">'+esc(r.created_at)+'</div><div class="body">'+esc(r.reason)+'</div></div>').join('');
  app.innerHTML=shell(x.name,x.judgement,'<div class="panel"><div class="chips">'+tag(x.status)+tag(x.stage)+tag(x.momentum)+'</div><div class="kv"><div class="key">利润池</div><div class="value">'+esc(x.profit_pool||'')+'</div></div><div class="kv"><div class="key">中国映射</div><div class="value">'+esc(x.china_relevance||'')+'</div></div><div class="kv"><div class="key">下一步观察</div><div class="value">'+esc(x.watch_next||'')+'</div></div></div><div class="section"><h3>证据链</h3><div class="list">'+evidence+'</div></div><div class="section"><h3>判断修订</h3><div class="list">'+(rev||empty('暂无修订'))+'</div></div>');
}
async function viewLedger(){
  const d=await get('/api/ledger');
  const body=d.items.length?'<div class="list">'+d.items.map(x=>'<div class="row"><div class="chips">'+tag(x.reviewed_at?'已复盘':'待验证')+tag(x.horizon)+'</div><div class="row-title">'+esc(x.judgement)+'</div><div class="muted">若判断错误：'+esc(x.falsification_signal||'待补充')+'</div></div>').join('')+'</div>':empty('还没有被确认的长期判断。');
  app.innerHTML=shell('判断账本','判断是否正确，与文章是否爆款是两回事。',body);
}
async function viewIntelligence(){
  const d=await get('/api/intelligence?limit=100');
  const body='<div class="list">'+d.items.map(x=>'<div class="row"><div class="chips">'+tag(x.source_role)+tag(x.lane)+tag(x.kind)+'</div><div class="row-title">'+esc(x.title)+'</div><div class="muted">'+esc(x.source_name)+' · '+esc(x.published_at||x.collected_at)+'</div></div>').join('')+'</div>';
  app.innerHTML=shell('情报池','专业工具：这里可以高密度，不影响前台决策。',body);
}
async function viewSources(){
  const d=await get('/api/sources');
  const body='<div class="list">'+d.items.map(x=>'<div class="row"><div class="chips">'+tag(x.role)+tag(x.lane)+(x.enabled?tag('启用'):tag('停用'))+'</div><div class="row-title">'+esc(x.name)+'</div><div class="muted">'+esc(x.url)+'</div><div class="'+(x.consecutive_failures?'bad':'good')+'">'+(x.last_success_at?'最近成功 '+esc(x.last_success_at):'尚未抓取')+(x.last_error?' · '+esc(x.last_error):'')+'</div></div>').join('')+'</div>';
  app.innerHTML=shell('来源状态','第一方事实源优先；发现源永远不能单独证明结论。',body);
}
async function viewSystem(){
  const d=await get('/api/health'),m=d.models||{};
  const rows=Object.entries(m).map(([k,v])=>'<div class="row"><div class="row-title">'+esc(k)+'</div><div class="'+(v.enabled?'good':'warn')+'">'+(v.enabled?'已启用 · '+esc(v.model):'未配置')+'</div></div>').join('');
  app.innerHTML=shell('系统状态','模型不在线时，不伪造认知结果。','<div class="list">'+rows+'</div>',d.last_run?'最近任务 '+d.last_run.status:'尚未运行');
}
const views={today:viewToday,decisions:viewDecisions,research:viewResearch,writing:viewWriting,trends:viewTrends,ledger:viewLedger,intelligence:viewIntelligence,sources:viewSources,system:viewSystem};
async function setView(v){state.view=v;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));try{await views[v]()}catch(e){app.innerHTML=empty('加载失败：'+e.message)}}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>setView(b.dataset.view));
setView('today');
</script>
</body>
</html>
