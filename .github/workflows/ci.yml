name: ci

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Backend tests
        run: pytest -q

      - name: Falsification gates
        run: |
          pytest -q tests/test_trend_falsify.py
          pytest -q tests/test_publication_gate.py
          pytest -q tests/test_evaluation.py
          pytest -q tests/test_llm_gateway.py

      - name: CLI smoke tests
        run: |
          trendradar init
          trendradar status

      - name: Frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Frontend build
        working-directory: frontend
        run: npm run build
